name: Daily video run

on:
  schedule:
    - cron: "20 0 * * *"        # 05:50 IST: right after the free pictures reset (05:30 IST)
    - cron: "0 1 * * 6"         # Saturday 06:30 IST: the weekly email check (owner's schedule)
    - cron: "5 7 * * *"         # 12:35 IST: right after the YouTube quota resets (12:30 IST, summer time)
    - cron: "15 8 * * *"        # 13:45 IST: after the quota reset in winter time (13:30 IST)
    - cron: "15 16 * * *"       # 21:45 IST: keeps rendering/uploading with whatever is left
  workflow_dispatch:
    inputs:
      max_hours:
        description: "Time budget for this run (hours, max 5.5)"
        default: "5.3"
      selftest:
        description: "Self-test only (render a 25 s test video, upload nothing)"
        type: boolean
        default: false
      write_only:
        description: "Only write the next episodes (no pictures, no rendering, no upload)"
        type: boolean
        default: false

concurrency:
  group: video-bot                # never two runs at once (all bot workflows share this)
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  BOT_WORK: ${{ github.workspace }}/work
  REPO_KEY: ${{ secrets.REPO_KEY }}
  YT_TOKEN: ${{ secrets.YT_TOKEN }}
  BOT_KEY: ${{ secrets.BOT_KEY }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_TOKEN: ${{ secrets.CF_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}   # optional second key
  GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}     # optional: a new Gumroad token set by the owner wins
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  GH_TOKEN: ${{ github.token }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # GitHub's maximum is 360; the bot works 5.3 h, the rest saves safely
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                 # newest code even when this run waited in the queue behind another run
      - name: Make disk space (full movies need it)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fonts for Indian scripts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core libraqm0 libfribidi0 > /dev/null
      - name: Unlock the bot
        run: pip install -q cryptography && python vault/boot.py open
      - run: pip install -q -r requirements.txt
      - name: Restore work (pictures in progress, music)
        uses: actions/cache/restore@v4
        with:
          path: work
          key: work-${{ github.run_id }}
          restore-keys: work-
      - name: Make and upload videos
        id: bot
        timeout-minutes: 318     # 3 setup + 318 + repair 20 + saving ~8 < 355: saving always gets its time
        run: |
          rm -f work/continue.flag
          if [ "${{ github.event.inputs.write_only }}" = "true" ]; then
            python bot/run.py --write-only
          elif [ "${{ github.event.inputs.selftest }}" = "true" ]; then
            python bot/run.py --selftest
          else
            python bot/run.py --max-hours "${{ github.event.inputs.max_hours || '5.1' }}"
          fi
      - name: Self-repair (only after a crash; a fix is kept only if the self-test passes)
        if: failure() && steps.bot.outcome == 'failure'
        timeout-minutes: 20
        run: python bot/repair.py
      - name: Keep the self-test video for checking
        if: github.event.inputs.selftest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            work/output/selftest/*.mp4
            work/output/selftest/thumbnail.jpg
          retention-days: 3
      - name: Save work
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work
          key: work-${{ github.run_id }}
      - name: Tidy old work caches
        if: always()
        run: gh cache list --key work- --sort created_at --order desc --limit 50 --json id --jq '.[2:][].id' | xargs -r -n1 gh cache delete || true
      - name: Lock the bot and save progress
        id: save
        if: always()
        run: |
          python vault/boot.py seal || true
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add vault.enc STATUS.md
          git diff --cached --quiet || git commit -q -m "bot: progress $(date -u +%F)"
          for try in 1 2 3; do        # code was pushed meanwhile: keep this run's progress + the newer code
            git push -q && break
            git fetch -q origin main
            git show origin/main:vault.enc > "$RUNNER_TEMP/remote.enc"
            python vault/boot.py adopt-code "$RUNNER_TEMP/remote.enc"
            python vault/boot.py seal
            git reset -q origin/main          # index = newest remote files; only vault + status are ours
            git add vault.enc STATUS.md
            git commit -q -m "bot: progress $(date -u +%F)"
          done
          git fetch -q origin main
          if [ "$(git rev-list --count origin/main..HEAD)" != "0" ]; then
            echo "SAVE FAILED: this run's progress could not be pushed"; exit 1
          fi
      - name: Next run right away (a requested movie is still being made)
        if: always() && steps.save.outcome == 'success' && hashFiles('work/continue.flag') != ''
        run: gh workflow run daily.yml --ref main
