name: Sample video (nothing uploaded)

on:
  push:                            # Claude / the owner: push samples/request.json to make a sample
    paths: ["samples/request.json"]
  workflow_dispatch:
    inputs:
      kind:
        description: "poem, song, promo, story or episode"
        default: "poem"
      topic:
        description: "Character / moment / topic (or the series name for an episode)"
        default: "कर्ण की पीड़ा - माँ कुंती से"
      link:
        description: "episode only: link to the existing episode / source"
        default: ""
      first_episode:
        description: "episode only: number of the first new episode (2 if episode 1 exists)"
        default: "1"

concurrency:
  group: sample-video              # runs next to the daily bot; never saves anything
  cancel-in-progress: false

permissions:
  contents: write                  # only to put the sample on the 'samples' release page

env:
  BOT_WORK: ${{ github.workspace }}/work
  REPO_KEY: ${{ secrets.REPO_KEY }}
  BOT_KEY: ${{ secrets.BOT_KEY }}
  YT_TOKEN: ${{ secrets.YT_TOKEN }}           # read only here: the sample job never uploads
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_TOKEN: ${{ secrets.CF_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}     # optional: a new Gumroad token set by the owner wins

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fonts for Indian scripts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core libraqm0 libfribidi0 > /dev/null
      - name: Unlock the bot
        run: pip install -q cryptography && python vault/boot.py open
      - run: pip install -q -r requirements.txt
      - name: Music and pictures from the bot's work cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: work
          key: work-sample-${{ github.run_id }}
          restore-keys: work-
      - name: What to make
        id: req
        env:
          EVENT: ${{ github.event_name }}
          IN_KIND: ${{ github.event.inputs.kind }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
          IN_LINK: ${{ github.event.inputs.link }}
          IN_FIRST: ${{ github.event.inputs.first_episode }}
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          r = json.load(open("samples/request.json", encoding="utf-8")) if os.environ["EVENT"] == "push" else {}
          for k, env, d in (("kind", "IN_KIND", "poem"), ("topic", "IN_TOPIC", ""), ("link", "IN_LINK", ""),
                            ("first_episode", "IN_FIRST", "1")):
              v = str(r.get(k) or os.environ.get(env) or d).replace("\n", " ")
              print(f"{k}={v}")
          EOF
      - name: Make the sample
        env:
          KIND: ${{ steps.req.outputs.kind }}
          TOPIC: ${{ steps.req.outputs.topic }}
          LINK: ${{ steps.req.outputs.link }}
          FIRST: ${{ steps.req.outputs.first_episode }}
        run: python -u bot/sample.py "$KIND" "$TOPIC" "$LINK" "$FIRST"
      - name: Put the sample on a page anyone with the link can open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view samples > /dev/null 2>&1 || gh release create samples --prerelease --title "Sample videos" --notes "Samples to look at - never uploaded to YouTube"
          for f in work/sample/*; do gh release upload samples "$f" --clobber; done
      - name: Keep the sample video
        uses: actions/upload-artifact@v4
        with:
          name: sample-video
          path: work/sample/*
          retention-days: 7
