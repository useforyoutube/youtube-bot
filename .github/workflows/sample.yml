name: Sample video (nothing uploaded)

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "poem, story or episode"
        default: "poem"
      topic:
        description: "Character / moment / topic (or the series name for an episode)"
        default: "कर्ण की पीड़ा - माँ कुंती से"
      link:
        description: "episode only: link to the existing episode / source"
        default: ""
      first_episode:
        description: "episode only: number of the first new episode (2 if episode 1 exists)"
        default: "1"

concurrency:
  group: sample-video              # runs next to the daily bot; never saves anything
  cancel-in-progress: false

permissions:
  contents: read

env:
  BOT_WORK: ${{ github.workspace }}/work
  REPO_KEY: ${{ secrets.REPO_KEY }}
  BOT_KEY: ${{ secrets.BOT_KEY }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_TOKEN: ${{ secrets.CF_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fonts for Indian scripts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core libraqm0 libfribidi0 > /dev/null
      - name: Unlock the bot
        run: pip install -q cryptography && python vault/boot.py open
      - run: pip install -q -r requirements.txt
      - name: Music and pictures from the bot's work cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: work
          key: work-sample-${{ github.run_id }}
          restore-keys: work-
      - name: Make the sample
        run: python bot/sample.py "${{ github.event.inputs.kind }}" "${{ github.event.inputs.topic }}" "${{ github.event.inputs.link }}" "${{ github.event.inputs.first_episode }}"
      - name: Keep the sample video
        uses: actions/upload-artifact@v4
        with:
          name: sample-video
          path: work/sample/*
          retention-days: 7
